<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGenX PRO - AI Content Automation</title>
    <!-- โหลด Tailwind CSS สำหรับดีไซน์บนมือถือและ PC -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121619',
                        cardBg: '#1a1f24',
                        inputBg: '#121619',
                        brandOrange: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 min-h-screen p-4 flex flex-col justify-between">

    <!-- ส่วนหัวโปรแกรม -->
    <header class="w-full max-w-md mx-auto py-3 border-b border-gray-800 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide">
                Auto<span class="text-brandOrange">GenX PRO</span> 🚀
            </h1>
            <p class="text-xs text-gray-400">ระบบ AI แปลงรูป/ลิงก์สินค้าเป็นคอนเทนต์อัตโนมัติ</p>
        </div>
        <span class="px-2.5 py-1 bg-yellow-500/10 text-brandOrange text-xs font-semibold rounded-full border border-yellow-500/20">Online</span>
    </header>

    <!-- ส่วนฟอร์มสั่งงานหลัก -->
    <main class="w-full max-w-md mx-auto my-4 space-y-4">
        
        <div class="bg-cardBg p-4 rounded-2xl shadow-xl border border-gray-800 space-y-3">
            <h2 class="text-sm font-bold text-white flex items-center gap-2">
                ✨ สร้างสคริปต์และวิดีโออัตโนมัติ
            </h2>

            <!-- เลือก AI Engine / สายฟรี -->
            <div>
                <label class="block text-xs font-medium mb-1 text-gray-300">เลือกสมองกล AI</label>
                <select id="aiProvider" class="w-full px-3 py-2 bg-inputBg border border-gray-700 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-brandOrange">
                    <option value="free_local">Free Local Simulator (สายฟรี 100%)</option>
                    <option value="gemini">Google Gemini (Flash/Pro)</option>
                    <option value="chatgpt">ChatGPT (OpenAI)</option>
                    <option value="grok">Super Grok</option>
                </select>
            </div>

            <!-- ช่องใส่ลิงก์หรือรูปภาพสินค้า -->
            <div>
                <label class="block text-xs font-medium mb-1 text-gray-300">ลิงก์สินค้า / รายละเอียด (Prompt)</label>
                <textarea id="productInput" rows="3" placeholder="วางลิงก์ TikTok Shop / Shopee หรือพิมพ์ชื่อสินค้า เช่น ทิชชู่ห่อหนาพิเศษ..." 
                          class="w-full px-3 py-2 bg-inputBg border border-gray-700 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-brandOrange placeholder-gray-500"></textarea>
            </div>

            <!-- แพลตฟอร์มเป้าหมาย -->
            <div>
                <label class="block text-xs font-medium mb-1 text-gray-300">แพลตฟอร์มปลายทาง</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <label class="flex items-center gap-1.5 p-2 bg-inputBg border border-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="platforms" value="TikTok" checked class="accent-amber-500"> TikTok
                    </label>
                    <label class="flex items-center gap-1.5 p-2 bg-inputBg border border-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="platforms" value="Shopee" checked class="accent-amber-500"> Shopee
                    </label>
                    <label class="flex items-center gap-1.5 p-2 bg-inputBg border border-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="platforms" value="Facebook" checked class="accent-amber-500"> Facebook
                    </label>
                    <label class="flex items-center gap-1.5 p-2 bg-inputBg border border-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="platforms" value="Instagram" checked class="accent-amber-500"> Instagram
                    </label>
                    <label class="flex items-center gap-1.5 p-2 bg-inputBg border border-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="platforms" value="YouTube" checked class="accent-amber-500"> YouTube
                    </label>
                </div>
            </div>

            <!-- ปุ่มสั่งทำงาน -->
            <button onclick="runAutoGenPro()" class="w-full mt-2 bg-brandOrange hover:bg-yellow-600 text-black font-bold py-2.5 rounded-xl text-sm transition duration-200 shadow-md">
                🚀 เริ่มสร้างสคริปต์และแคปชันอัตโนมัติ
            </button>
        </div>

        <!-- กล่องแสดงสถานะและผลลัพธ์ (Logs) -->
        <div class="bg-cardBg p-4 rounded-2xl shadow-xl border border-gray-800">
            <h3 class="text-xs font-bold text-gray-400 mb-2">ผลลัพธ์การทำงาน (Content Package Logs)</h3>
            <div id="logOutput" class="bg-black/40 p-3 rounded-xl text-xs font-mono text-green-400 h-48 overflow-y-auto whitespace-pre-line">
> ระบบ AutoGenX PRO พร้อมใช้งาน...
> รอรับข้อมูลสินค้าจากคุณนายสายอีสาน
            </div>
        </div>

    </main>

    <!-- ส่วนท้าย -->
    <footer class="text-center text-xs text-gray-500 py-2">
        AutoGenX PRO &copy; 2026 - Mobile AI Content Automation
    </footer>

    <!-- จาวาสคริปต์จำลองการทำงานฝั่งหน้าเว็บ -->
    <script>
        function runAutoGenPro() {
            const ai = document.getElementById('aiProvider').value;
            const input = document.getElementById('productInput').value.trim();
            const logBox = document.getElementById('logOutput');

            if(!input) {
                alert('กรุณากรอกลิงก์หรือรายละเอียดสินค้าก่อนค่ะ!');
                return;
            }

            // รวบรวมแพลตฟอร์มที่เลือก
            const selectedPlatforms = Array.from(document.querySelectorAll('input[name="platforms"]:checked')).map(el => el.value);

            logBox.innerHTML = `> กำลังประมวลผลด้วย [${ai.toUpperCase()}]...\n> สินค้า: ${input}\n> แพลตฟอร์ม: ${selectedPlatforms.join(', ')}\n`;

            setTimeout(() => {
                let resultText = `\n✅ สร้างแพ็กเกจสำเร็จ!\n\n`;
                resultText += `🎬 [สคริปต์วิดีโอ 4 ขั้นตอน]\n`;
                resultText += `1. Hero: เปิดตัวดึงดูดสายตาสำหรับ "${input}"\n`;
                resultText += `2. Detail: เจาะลึกจุดเด่นความคุ้มค่า\n`;
                resultText += `3. Usage: สาธิตการใช้งานจริง\n`;
                resultText += `4. Final Shot: พิกัดตะกร้าเหลือง รีบด่วน!\n\n`;
                
                resultText += `📝 [แคปชันพร้อมโพสต์]\n`;
                selectedPlatforms.forEach(p => {
                    resultText += `- [${p}]: ป้ายยาแรงมาก! ${input} พิกัดในตะกร้าเลยจ้า 🛒 #${p} #คุณนายสายอีสาน\n`;
                });

                logBox.innerHTML += resultText;
                logBox.scrollTop = logBox.scrollHeight;
            }, 1200);
        }
    </script>
</body>
</html>
